[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "skinnet-plus"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "torchvision>=0.20,<1", "pandas>=2.2,<3", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "Pillow>=10.4,<13", "matplotlib>=3.9,<4", "streamlit>=1.40,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]
[project.scripts]
skinnet = "app.main:main"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
